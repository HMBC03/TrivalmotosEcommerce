# data base connecction

spring.application.name=CRUD
server.port=8085
spring.datasource.url=jdbc:mysql://localhost:3306/trivalmotos
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:3254}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

#Important data for oauth2 with google#
# Google Login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8085/login/oauth2/code/google